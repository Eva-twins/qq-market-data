name: update-data
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4 playwright && playwright install --with-deps chromium
      - name: Dump layout
        run: PEER_DUMP=1 python scripts/peer_fetch.py 2>&1 | tee dump.log
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          cp dump.log logs/dump.log || true
          git add data/layout_dump.json logs/dump.log
          git commit -m "layout dump" || echo none
          git pull --rebase -q || true
          git push
