name: probe-peer
on:
  workflow_dispatch:
  push:
    paths: ['scripts/probe_peer.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -qq poppler-utils
      - run: pip install requests
      - name: Probe
        run: python scripts/probe_peer.py 2>&1 | tee probe.log
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p logs && cp probe.log logs/probe_peer.log || true
          git add data/probe_peer.json logs/probe_peer.log
          git commit -m "probe peer reports $(date -u +%F)" || echo "nothing"
          git pull --rebase -q || true
          git push
