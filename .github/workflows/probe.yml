name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save SITCA page
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -L -m 60 -A "$UA" -o probe/sitca.html "https://www.sitca.org.tw/ROC/Industry/IN4001.aspx?pid=IN2211_04" || true
          curl -sS -L -m 60 -A "$UA" -o probe/sitca2.html "https://www.sitca.org.tw/ROC/Industry/IN4001.aspx?PGMID=IN0401" || true
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "probe: sitca" || true
          git pull --rebase -q || true
          git push
