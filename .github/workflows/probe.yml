name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump pivot headers
        continue-on-error: true
        run: |
          mkdir -p probe
          pip install -q xlrd requests
          python - <<'PY' > probe/xls_headers.txt 2>&1
          import xlrd,requests
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"}
          for n in ["MonBif1","MonClm1","MonInvBif1","MonInvClm1","MonInvNew1","MonInvPrm1","MonNew1","MonPrm1"]:
              r=requests.get(f"https://pivot.tii.org.tw/lifesta/xPivo{n}.xls",headers=UA,timeout=90)
              b=xlrd.open_workbook(file_contents=r.content);s=b.sheet_by_index(0)
              print("=====",n,s.nrows,s.ncols,b.sheet_names())
              for i in range(min(9,s.nrows)):
                  print(i,[str(x).strip()[:18] for x in s.row_values(i)])
              print("... last row:",[str(x).strip()[:12] for x in s.row_values(s.nrows-1)])
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A probe; git commit -m "probe headers" || true; git pull --rebase -q || true; git push
