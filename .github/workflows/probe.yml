name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest report
        continue-on-error: true
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          curl -sS -L -A "$UA" -o probe/latest.pdf "https://www.lia-roc.org.tw/storage/uploads/6afbcaceabc86.pdf" 2> probe/err.txt
          which pdftotext >> probe/err.txt 2>&1 || true
          pdftotext -layout probe/latest.pdf probe/latest.txt 2>> probe/err.txt || true
          rm -f probe/latest.pdf
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A probe; git commit -m "probe latest report" || true; git pull --rebase -q || true; git push
