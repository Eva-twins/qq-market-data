name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tii pivot xls
        run: |
          mkdir -p probe/xls
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          : > probe/xls_result.txt
          for n in MonBif1 MonClm1 MonInvBif1 MonInvClm1 MonInvNew1 MonInvPrm1 MonNew1 MonPrm1; do
            curl -sS -L -m 60 -A "$UA" -o probe/xls/xPivo$n.xls -w "$n code=%{http_code} type=%{content_type} size=%{size_download}\n" "https://pivot.tii.org.tw/lifesta/xPivo$n.xls" >> probe/xls_result.txt 2>&1 || echo "$n curl_failed" >> probe/xls_result.txt
          done
          file probe/xls/* >> probe/xls_result.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "probe: tii xls" || true
          git pull --rebase -q || true
          git push
